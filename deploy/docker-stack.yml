version: "3.9"

# Updating this service (Swarm tag caching):
# Swarm reuses a locally present image for a tag and does NOT re-check the
# registry, so `docker stack deploy` with an unchanged `image:` line can keep
# running the old build. To pick up a new `latest` (or a re-pushed tag):
#   1) wait until the build has actually published the tag, then
#   2) docker pull ofloo/pagermcp:latest            (on the node)
#   3) docker service update --force <stack>_pagermcp
# Pinning the version tag (for example `ofloo/pagermcp:v0.3.4`) is the
# deterministic alternative: a new tag is always fetched, and the running
# version is visible in the stack file.
services:
  pagermcp:
    image: ofloo/pagermcp:latest
    environment:
      MODE: "server"
      PORT: "8080"
      DATA_DIR: /data
      MAILBOX_TTL_DAYS: "30"
      MESSAGE_TTL_DAYS: "7"
      MAX_MESSAGES_PER_MAILBOX: "128"
      MAX_MESSAGE_BYTES: "65536"
    ports:
      - "${PAGER_PORT:-8080}:8080"
    volumes:
      - pagermcp_data:/data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

volumes:
  pagermcp_data:

# Client example (run outside this stack):
# docker run --rm -i -v "$PWD":/workspace -e MODE=client -e PROJECT_DIR=/workspace -e SERVER_URL=http://pagermcp:8080 ofloo/pagermcp:latest
