version: "3.9"

# Deployment rule: PIN THE VERSION. Do not deploy `:latest`.
#
# Swarm resolves an image tag to whatever digest each node has cached, and every
# node keeps its own cache. With `:latest`, a task that moves to another node
# can silently run an older build, and `docker pull` on one node does not cover
# the others. A *pinned* tag or digest does not exist on the nodes until the
# deploy fetches it, so every node gets exactly that build. That makes the
# per-node cache problem impossible by construction.
#
# Release procedure:
#   1) publish the release (version tag + `latest`) and wait for the build to
#      finish,
#   2) set `image:` below to the new version tag (or its digest),
#   3) docker stack deploy -c deploy/docker-stack.yml <stack>   (on the manager)
#   4) docker service update --force --with-registry-auth <stack>_pagermcp
#   5) verify with:
#        docker service ps <stack>_pagermcp --no-trunc \
#          --format '{{.Name}} {{.Node}} {{.CurrentState}} {{.Image}}'
#        curl -s https://pager.ofloo.io/version      # version + build number
#
# `latest` may still be published for people who run it locally, but the
# production stack must not reference it.
services:
  pagermcp:
    # Bump this on every release. Keep it a concrete version tag (or digest).
    image: ofloo/pagermcp:v0.3.5
    environment:
      MODE: "server"
      PORT: "8080"
      DATA_DIR: /data
      MAILBOX_TTL_DAYS: "30"
      MESSAGE_TTL_DAYS: "7"
      MAX_MESSAGES_PER_MAILBOX: "128"
      MAX_MESSAGE_BYTES: "65536"
    # Swarm templates this: the container hostname becomes the node that runs
    # the task plus its slot, so `GET /version` (which reports `hostname`)
    # shows which node answered, not just the container id.
    hostname: "{{.Node.Hostname}}-{{.Task.Slot}}"
    ports:
      - "${PAGER_PORT:-8080}:8080"
    volumes:
      - pagermcp_data:/data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

volumes:
  pagermcp_data:

# Client example (run outside this stack):
# docker run --rm -i -v "$PWD":/workspace -e MODE=client -e PROJECT_DIR=/workspace -e SERVER_URL=http://pagermcp:8080 ofloo/pagermcp:latest
