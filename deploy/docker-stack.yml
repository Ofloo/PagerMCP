version: "3.9"

# Updating this service (Swarm tag caching, per node):
# Swarm reuses a locally present image for a tag and does NOT re-check the
# registry, and every node keeps its own image cache. A task that moves to
# another node therefore runs whatever digest that node cached for the tag,
# even if the manager already pulled the new one. `docker pull` on one node
# does not cover the others.
#
# Deterministic update:
#   1) wait until the build has actually published the tag, then
#   2) pin the version tag in `image:` (for example `ofloo/pagermcp:v0.3.4`)
#      or the digest `ofloo/pagermcp@sha256:...`; a tag/digest that does not
#      exist locally is always fetched on whichever node the task lands, and
#   3) docker service update --force <stack>_pagermcp
#
# If you must use `latest`, pull it on EVERY node that can run the task:
#   docker node ls                                  # list nodes
#   docker node ps <node>                           # where it runs
#   docker pull ofloo/pagermcp:latest               # on each candidate node
#   docker service update --force <stack>_pagermcp
#
# Verify which image the task really runs (this is the ground truth, not the
# image store):
#   docker service ps <stack>_pagermcp --no-trunc \
#     --format '{{.Name}} {{.Node}} {{.CurrentState}} {{.Image}}'
#   curl -s https://pager.ofloo.io/version          # version + build number
#
# Prefer pinning: `latest` can silently roll back to an older cached build when
# the task moves to a node that has not pulled the new tag yet.
services:
  pagermcp:
    image: ofloo/pagermcp:latest
    environment:
      MODE: "server"
      PORT: "8080"
      DATA_DIR: /data
      MAILBOX_TTL_DAYS: "30"
      MESSAGE_TTL_DAYS: "7"
      MAX_MESSAGES_PER_MAILBOX: "128"
      MAX_MESSAGE_BYTES: "65536"
    ports:
      - "${PAGER_PORT:-8080}:8080"
    volumes:
      - pagermcp_data:/data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

volumes:
  pagermcp_data:

# Client example (run outside this stack):
# docker run --rm -i -v "$PWD":/workspace -e MODE=client -e PROJECT_DIR=/workspace -e SERVER_URL=http://pagermcp:8080 ofloo/pagermcp:latest
